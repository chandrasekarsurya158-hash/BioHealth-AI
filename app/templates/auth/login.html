{% extends "base.html" %}

{% block title %}User Login - BioHealth AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-2 text-success fs-1">
                        <i class="bi bi-box-arrow-in-right"></i>
                    </div>
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-muted small">Sign in to access your personal dashboard and history</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control bg-light border-start-0" id="email" name="email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control bg-light border-start-0" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-3 shadow-sm mb-3">
                        <i class="bi bi-door-open me-1"></i> Sign In
                    </button>
                </form>

                <div class="text-center mt-3">
                    <p class="small text-muted mb-1">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-success fw-semibold text-decoration-none">Create one</a></p>
                    <a href="{{ url_for('admin.login') }}" class="small text-secondary text-decoration-none"><i class="bi bi-shield-lock me-1"></i>Administrator Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
