[project]
name = "biohealth-ai"
version = "2.0.0"
description = "Multi-Domain AI Disease Detection & Intelligent Health Assistance System"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0.0",
    "Werkzeug>=3.0.0",
    "python-dotenv>=1.0.0",
    "PyMySQL>=1.1.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "PyMuPDF>=1.24.0",
]

[tool.vercel]
entrypoint = "run:app"
